- type: entity
  name: glasscap
  description: Glass doesn't grow on trees! It grows on mushrooms, of course.
  id: GlassLog
  parent: [ProduceBase]
  components:
  - type: Sprite
    sprite: _Maid/Objects/Specific/Hydroponics/glasscap.rsi
  - type: SolutionContainerManager
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
  - type: Produce
    seedId: glasscap
  - type: Log
    spawnedPrototype: SheetGlass1
    spawnCount: 1

