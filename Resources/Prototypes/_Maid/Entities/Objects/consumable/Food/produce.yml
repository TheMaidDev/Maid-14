- type: entity
  name: galaxyarrow
  parent: [ FoodProduceBase ]
  id: FoodGalaxyarrow
  description: A medicinal plant used for its antitoxin.
  components:
  - type: FlavorProfile
    flavors:
      - medicine
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Razorium
          Quantity: 5
  - type: Sprite
    sprite: _Maid/Objects/Specific/Hydroponics/galaxyarrow.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    seedId: Galaxyarrow
  - type: Extractable
    grindableSolutionName: food
  - type: Tag
    tags:
    - Galaxythistle
    - Fruit
  - type: SolutionInjectOnEmbed
    transferAmount: 100
    blockSlots: NONE
    solution: food
  - type: SolutionTransfer
    maxTransferAmount: 100
  - type: EmbeddableProjectile
    minimumSpeed: 3
    removalTime: 0.5
    offset: 0.0,0.0
  - type: ThrowingAngle
    angle: 180
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 4
  - type: MeleeWeapon
    animationRotation: -0
    wideAnimationRotation: -0
    damage:
      types:
        Piercing: 2
    angle: 0
    animation: WeaponArcThrust
  - type: MeleeChemicalInjector
    solution: food
  - type: RefillableSolution
    solution: food
  - type: InjectableSolution
    solution: food
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.20,0.10
            - 0.10,-0.20
            - 0.20,-0.10
            - -0.10,0.20
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  
- type: entity
  name: dragon fruit
  parent: FoodProduceBase
  id: FoodDragonFruit
  description: The humble dragon fruit.
  components:
  - type: FlavorProfile
    flavors:
      - dragonfruit
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Ichor
          Quantity: 2
        - ReagentId: CarpoToxin
          Quantity: 5
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/dragon_fruit.rsi
  - type: Produce
    seedId: DragonFruit
  - type: Tag
    tags:
    - Fruit
  - type: FoodSequenceElement
    entries:
      Taco: Bungo
      Burger: Bungo
      
- type: entity
  name: glowing berries
  parent: FoodProduceBase
  id: FoodRadioactiveBerries
  description: "They look so delicious! But for some reason it's hard to look at them."
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Radium
          Quantity: 5
        - ReagentId: Uranium
          Quantity: 5
  - type: Sprite
    sprite: _Maid/Objects/Specific/Hydroponics/radioactive_berry.rsi
  - type: Produce
    seedId: RadioactiveBerries
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: NuclearCola
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
  - type: RadiationSource
    intensity: 0.3
  - type: PointLight
    color: "#19FF19FF"
    energy: 2.5
    radius: 1.5
    softness: 1