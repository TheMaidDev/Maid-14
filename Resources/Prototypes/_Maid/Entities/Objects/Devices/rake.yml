# Maid-14 rake trap: armed with use-in-hand, hidden step trigger, whacks the stepper.
- type: entity
  id: Rake
  parent: BaseItem
  name: rake
  description: A garden rake. Lying around innocently, waiting for someone to step on it.
  components:
  - type: Sprite
    sprite: _Maid/Objects/Devices/rake.rsi
    drawdepth: SmallMobs # lying flat on the floor
    layers:
    - state: rake
  - type: Item
    sprite: _Maid/Objects/Devices/rake.rsi
    size: Ginormous # too big for any container, and no Clothing slot either — no back-wearing
  - type: MeleeWeapon
    attackRate: 0.5 # huge and slow
    range: 2.0 # long handle
    angle: 90 # wide head sweep
    wideAnimationRotation: 135
    heavyStaminaCost: 10
    damage:
      types:
        Blunt: 12
    soundHit:
      collection: MetalThud # blunt thud like the other wooden melee weapons (bat, shovel)
  - type: Wieldable
    unwieldOnUse: false # use-in-hand wields first; a second use deploys the trap
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 8
  - type: StepTrigger
    intersectRatio: 0.1
    requiredTriggeredSpeed: 1.5 # must actually step on it; crawling/lying bodies don't trigger
    stepOn: true
  - type: RakeTrap
  - type: UseDelay
  - type: Physics
    bodyType: Dynamic
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.28,-0.28,0.28,0.28"
        hard: false
        layer:
        - LowImpassable
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.28,-0.28,0.28,0.28"
        density: 30
        mask:
        - ItemMask
  - type: Tag
    tags:
    - HideContextMenu
