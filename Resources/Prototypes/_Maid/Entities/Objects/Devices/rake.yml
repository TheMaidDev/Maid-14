# Maid-14 rake trap: armed with use-in-hand, hidden step trigger, whacks the stepper.
- type: entity
  id: Rake
  parent: BaseItem
  name: rake
  description: A garden rake. Lying around innocently, waiting for someone to step on it.
  components:
  - type: Sprite
    sprite: _Maid/Objects/Devices/rake.rsi
    drawdepth: SmallMobs # lying flat on the floor
    layers:
    - state: rake
  - type: Item
    sprite: _Maid/Objects/Devices/rake.rsi
    size: Ginormous
  - type: MeleeWeapon
    attackRate: 0.5
    range: 2.0
    angle: 90
    wideAnimationRotation: 135
    heavyStaminaCost: 10
    damage:
      types:
        Blunt: 3
    soundHit:
      collection: MetalThud
  - type: Wieldable
    unwieldOnUse: true
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 8
  - type: StepTrigger
    intersectRatio: 0.1
    requiredTriggeredSpeed: 1.5
    stepOn: true
  - type: RakeTrap
  - type: UseDelay
  - type: Physics
    bodyType: Dynamic
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.28,-0.40,0.28,-0.05"
        hard: false
        layer:
        - LowImpassable
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.28,-0.40,0.28,-0.05"
        density: 30
        mask:
        - ItemMask
  - type: Tag
    tags:
    - HideContextMenu
