- type: entity
  id: TestSoundEmitter
  name: sound emitter
  description: Emits a beep every 5 seconds. Used to test path sound occlusion.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Objects/Devices/singularity_beacon.rsi
    layers:
    - state: icon
  - type: SpamEmitSound
    sound:
      path: /Audio/Machines/beep.ogg
      params:
        maxDistance: 30
    minInterval: 5
    maxInterval: 5
