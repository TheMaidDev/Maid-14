- type: entity
  id: Stunbaton
  components:
  - type: Stunbaton
    energyPerUse: 100
    lightAttackEnergyMultiplier: 1
  - type: MeleeWeapon
    canHeavyAttack: false
    canWideSwing: false
  - !Remove type: DelayedKnockdownOnHit
  - !Remove type: UseDelayBlockMelee
  - !Remove type: UseDelay
  - type: TgStunbaton
    throwStaminaDamage: 60
    knockdownDelay: 2
    knockdownTime: 5
    cooldown: 2.5
    throwStunChance: 0.35
    jitterTime: 4
    stutterTime: 16

- type: entity
  id: StasisBaton
  components:
  # The !Remove entries above cascade from the Stunbaton parent; restore the Goob stasis behavior.
  # The parent's Maid tuning (no heavy/wide swings, lightAttackEnergyMultiplier 1) is intentional here too.
  - type: DelayedKnockdownOnHit
    useDelay: stunbaton
  - type: UseDelayBlockMelee
    delays:
    - stunbaton
  - type: UseDelay
    delays:
      stunbaton:
        length: 2.5
  - type: TgStunbaton
    enabled: false
