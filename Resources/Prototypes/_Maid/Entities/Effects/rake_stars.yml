# Maid-14 dizzy stars: spawned on a rake victim, orbits their head (OrbitVisuals).
- type: entity
  id: RakeDizzyStars
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2.5
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _Maid/Objects/Effects/rake_stars.rsi
      state: stars
  - type: OrbitVisuals
  - type: Tag
    tags:
    - HideContextMenu
