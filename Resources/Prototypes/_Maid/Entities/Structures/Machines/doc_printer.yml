# Document printer (ported from the old build) with a department cargo order tab.
- type: entity
  id: DocPrinter
  parent: BaseMachinePowered
  name: document form printer
  description: Prints blank forms for all kinds of documents and department cargo order slips. Bluespace technology in the service of bureaucracy!
  components:
  - type: Sprite
    sprite: _Maid/Structures/Machines/doc_printer.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
      map: [ "enum.DocumentPrinterVisualLayers.Base" ]
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DocumentPrinterVisuals.Printing:
        enum.DocumentPrinterVisualLayers.Base:
          True: { state: printing }
          False: { state: icon }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 25
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Transform
    anchored: true
  - type: Pullable
  - type: StaticPrice
    price: 800
  - type: ActivatableUI
    key: enum.DocumentPrinterUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.DocumentPrinterUiKey.Key:
        type: DocumentPrinterBoundUserInterface
  - type: DocumentPrinter
    sections:
    - name: doc-printer-section-centcomm
      documents:
      - BoxFolderGreenBAN
      - PaperRequestTargetStation
      - PaperReportCC
      - PaperCompletedStation
      - PaperFailedStation
      - PaperRequestCentComm
      - PaperRequestERT
      - PaperRequestRXBZZ
      - PaperRequestExecution
      - PaperRequestMagistrat
    - name: doc-printer-section-command
      documents:
      - BoxFolderBlueBAN
      - PaperDomotionComm
      - PaperDismissalReq
      - PaperRequestHeadCouncil
      - PaperHeadCouncilEnd
    - name: doc-printer-section-security
      documents:
      - BoxFolderRedBAN
      - PaperOrderSec
      - PaperDonos
      - PaperLic
      - PaperTimeRequestWeapon
      - PaperRequestExecutionSec
      - PaperOrderWeapon
      - PaperRequestGuard
    - name: doc-printer-section-engineering
      documents:
      - BoxFolderRYellowBAN
      - PaperRequestBuild
      - PaperRequestMaterial
      - PaperReportElect
      - PaperReportAtmos
    - name: doc-printer-section-medical
      documents:
      - BoxFolderWhiteBAN
      - PaperRequestNarco
      - PaperRequestExecutionMed
      - PaperWaiverOfClaims
      - PaperDurka
    - name: doc-printer-section-science
      documents:
      - BoxFolderPurpleBAN
      - PaperRequestReasonable
      - PaperRequestLaw
      - PaperBrain
    - name: doc-printer-section-cargo
      documents:
      - BoxFolderYellowBAN
      - PaperCargoOrder
    - name: doc-printer-section-service
      documents:
      - BoxFolderGreyBAN
      - PaperRequestUpID
      - PaperRequestWork
      - PaperRequestTrash
      - PaperEndTrash
      - PaperRequestCourt
      - PaperDismissalSer
      - PaperPromotion
      - PaperRequestBotan
    emagSections:
    - name: doc-printer-section-syndicate
      documents:
      - BoxFolderBlackBAN
      - PaperSyndicat
  - type: OnEmaggedHandler
  - type: CargoOrderConsole
    account: Service
    announcementChannel: Service
    mode: PrintSlip

- type: entity
  id: DocPrinterEngineering
  parent: DocPrinter
  components:
  - type: CargoOrderConsole
    account: Engineering
    announcementChannel: Engineering
    mode: PrintSlip

- type: entity
  id: DocPrinterMedical
  parent: DocPrinter
  components:
  - type: CargoOrderConsole
    account: Medical
    announcementChannel: Medical
    mode: PrintSlip

- type: entity
  id: DocPrinterScience
  parent: DocPrinter
  components:
  - type: CargoOrderConsole
    account: Science
    announcementChannel: Science
    mode: PrintSlip

- type: entity
  id: DocPrinterSecurity
  parent: DocPrinter
  components:
  - type: CargoOrderConsole
    account: Security
    announcementChannel: Security
    mode: PrintSlip

