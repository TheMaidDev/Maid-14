- type: entity
  id: BaseSeniorsLocker
  parent: LockerBaseSecure
  abstract: true
  name: base seniors locker
  components:
  - type: Sprite
    sprite: _Maid/Structures/Storage/senor_lockers.rsi
    noRot: true

# Ветеран СБ
- type: entity
  id: LockerVeteran
  parent: BaseSeniorsLocker
  name: veteran locker
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: vet_locker
    stateDoorOpen: vet_open
    stateDoorClosed: vet_door
  - type: AccessReader
    access: [ [ "Security" ] ]

- type: entity
  id: LockerVeteranFilled
  parent: LockerVeteran
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: FlashlightSeclite
    - id: ClothingUniformJumpsuitSecGrey
      prob: 0.3
    - id: ClothingHeadHelmetBasic
    - id: ClothingOuterArmorBasic
    - id: ClothingBeltSeniorSecurityFilled
    - id: Flash
      prob: 0.5
    - id: ClothingEyesGlassesSecurity
    - id: ClothingHeadsetAltSecurity
    - id: ClothingHandsGlovesColorBlackSecurity
    - id: ClothingShoesBootsJack
    - id: WeaponMeleeNeedle
      prob: 0.1
    - id: WeaponDisabler
    - id: HoloprojectorSecurity
      prob: 0.6
    - id: WeaponPistolMk58
    - id: MagazinePistol
    - id: SurveillanceWirelessCameraBodySecurity
    - id: ClothingHeadHatBeretSecurity

