- type: customGhost
  id: niko
  category: personal
  name: Нико
  desc: Существо из другого мира
  addComponents:
  - type: Sprite
    sprite: _Maid/CustomGhosts/niko.rsi
    color: "#fff8"
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: niko
      shader: unshaded
  - type: SpriteMovement
    movementLayers:
      movement:
        state: niko-moving
    noMovementLayers:
      movement:
        state: niko
  restrictions:
  - !type:CkeyRestriction
    ckey:
    - CREAsTIVE
