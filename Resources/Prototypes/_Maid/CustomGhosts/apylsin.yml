- type: customGhost
  id: apylsinBird
  category: personal
  name: Кто нахуй
  desc: гооол
  addComponents:
  - type: Sprite
    sprite: _Maid/CustomGhosts/bird.rsi
    color: "#fff8"
    noRot: true
    overrideContainerOcclusion: true
    drawdepth: Ghosts
    layers:
    - state: bird
      shader: unshaded
      sprite: _Maid/CustomGhosts/bird.rsi
  restrictions:
  - !type:CkeyRestriction
    ckey:
    - apylsin

