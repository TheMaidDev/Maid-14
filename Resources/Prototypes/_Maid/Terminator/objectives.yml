- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseTerminatorObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: objective-issuer-susnet
  - type: RoleRequirement
    roles:
    - TerminatorRole

- type: entity
  parent: [BaseTerminatorObjective, BaseKillObjective]
  id: TerminateObjective
  name: Terminate the target.
  description: Follow your programming and terminate the target.
  components:
  - type: Objective
    unique: false
  - type: PickSpecificPerson
  - type: TargetObjective
    title: objective-terminate-title
  - type: KillPersonCondition
    requireDead: true

- type: entity
  parent: BaseTerminatorObjective
  id: ShutDownObjective
  name: Shut down.
  description: Once the mission is complete, die to prevent the crew from stealing future technology.
  components:
  - type: Objective
    icon:
      sprite: Mobs/Species/Terminator/parts.rsi
      state: skull_icon
  - type: DieCondition
