      baseWeight: 10
    - id: Traitor
      baseWeight: 10

    midroundSpawnTimer: # How often we spawn rules
      min: 180 # 3 min
      max: 600 # 10 min

    midroundSpawnSkipProb: 0.6 # With what chance we skip spawning rule

    scoreDifferenceMultiplierDecay: 850
    scoreDifferenceMultiplierMin: 0.15

    midroundRules:
    - id: ZombieOutbreak
      baseWeight: 10
      conditions:
      - !type:AdaptiveRuleCooldownCondition
        cooldown: 900 # 15 min
      - !type:AdaptiveRuleMaxOccurenceCondition
        amount: 2
