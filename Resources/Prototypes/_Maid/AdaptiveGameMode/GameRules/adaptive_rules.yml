- type: entity
  parent: BaseGameRule
  id: AdaptiveRule
  components:
  - type: GameRule
    minPlayers: 0
  - type: AdaptiveRule
    roundstartScorePerPlayer:
      chaos: -2
      combat: -2
    roundstartTargetBudgetBase:
      chaos: 0
      combat: 0
    roundstartTargetBudgetSlope:
    - time: 7200
      value:
        chaos: 5
        combat: 0
    - time: 9000
      value:
        chaos: 20
        combat: 40
    - time: 10800
      value:
        chaos: 50
        combat: 100
    roundstartMaxRules: 1
    roundstartUsePotentialScore: false
    roundstartRules:
    - id: AdaptiveZombie
      baseWeight: 10
    - id: AdaptiveChangeling
      baseWeight: 10
    - id: AdaptiveCorporateAgent
      baseWeight: 10
    - id: AdaptiveNukeops
      baseWeight: 10
    - id: AdaptiveWizard
      baseWeight: 10
    - id: AdaptiveRevolutionary
      baseWeight: 10
    - id: AdaptiveTraitor
      baseWeight: 10

    midroundSpawnTimer: # How often we spawn rules
      min: 180 # 3 min
      max: 600 # 10 min

    # midroundSpawnSkipProb: 0.6 # With what chance we skip spawning rule

    # Magic numbers: more info in Content.Server._Maid.AdaptiveGameMode.AdaptiveRuleSystem.GetRulesWeighted.GetMultiplier
    k2: 0
    p2: 1
    s2: 13

    midroundRules:
    - id: ItemArtifacts
      baseWeight: 10
    - id: ZombieOutbreak
      baseWeight: 10
      conditions:
      - !type:AdaptiveRuleCooldownCondition
        cooldown: 900 # 15 min
      - !type:AdaptiveRuleMaxOccurenceCondition
        amount: 2
