- type: entity
  parent: BaseGameRule
  id: AdaptiveRule
  components:
  - type: GameRule
    minPlayers: 0
  - type: AdaptiveRule
    roundstartTargetBudgetBase:
      chaos: 0
      combat: 0
    roundstartTargetBudgetSlope:
    - time: 7200
      value:
        chaos: 5
        combat: 0
    - time: 9000
      value:
        chaos: 20
        combat: 40
    - time: 10800
      value:
        chaos: 50
        combat: 100
    roundstartRules:
    - id: Zombie
      baseWeight: 10
