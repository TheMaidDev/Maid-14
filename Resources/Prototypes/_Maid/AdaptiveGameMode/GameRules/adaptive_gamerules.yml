# Midround Rules with Adaptive Scores
- type: entity
  parent: AnomalySpawn
  id: AdaptiveAnomalySpawn
  components:
  - type: AdaptivePotentialScoreEntity
    prototype: AnomalyPyroclastic

- type: entity
  parent: BluespaceArtifact
  id: AdaptiveBluespaceArtifact
  components:
  - type: AdaptiveScoreStatic
    chaosScore: 5
    combatScore: 0

- type: entity
  parent: ClosetSkeleton
  id: AdaptiveClosetSkeleton
  components:
  - type: AdaptiveScoreStatic
    chaosScore: 3
    combatScore: 0

- type: entity
  parent: GasLeak
  id: AdaptiveGasLeak
