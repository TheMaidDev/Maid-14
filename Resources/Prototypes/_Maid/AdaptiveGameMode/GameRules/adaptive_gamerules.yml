    chaosScore: 5
    combatScore: 0

- type: entity
  parent: PowerGridCheck
  id: AdaptivePowerGridCheck
  components:
  - type: AdaptiveScoreStatic
    chaosScore: 5
    conditions:
    - !type:HasComponent
      components:
      - ActiveGameRule

