- type: adaptiveScoreConditionsTable
  id: ActiveAntag
  conditions:
  - !type:Controlled
  - !type:Alive

- type: adaptiveScoreConditionsTable
  id: ActiveGamerule
  conditions:
  - !type:HasComponent
    components:
    - ActiveGameRule

- type: adaptiveScoreConditionsTable
  id: OnStationGrid
  conditions:
  - !type:OnStation
    onGrid: true

- type: adaptiveScoreConditionsTable
  id: OnStationMap
  conditions:
  - !type:OnStation
    onGrid: false

- type: adaptiveScoreConditionsTable
  id: ObjectiveNotCompleted
  conditions:
  - !type:ObjectiveCompletion
  - !type:ObjectiveOwner
    conditions:
    - !type:MetTable
      tables:
      - ActiveAntag
