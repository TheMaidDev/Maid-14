- type: !PartialOnly entity
  id: PowerDrill
  components:
  - type: Tool
    useSound: /Audio/_Maid/Override/Items/drill_use.ogg
  - type: MultipleTool
    entries:
    - !CombineIndex:0 useSound:
        path: /Audio/_Maid/Override/Items/drill_use.ogg
    - !CombineIndex:1 useSound:
        path: /Audio/_Maid/Override/Items/drill_use.ogg
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_Maid/Override/Items/drill_hit.ogg
  - type: SurgeryTool
    startSound: /Audio/_Maid/Override/Items/drill_use.ogg
- type: !PartialOnly entity
  id: Omnitool
  components:
  - type: Tool
    useSound: /Audio/_Maid/Override/Items/drill_use.ogg
  - type: MultipleTool
    entries:
    - !CombineIndex:0 useSound:
        path: /Audio/_Maid/Override/Items/drill_use.ogg
