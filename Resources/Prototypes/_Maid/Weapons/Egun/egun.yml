- type: entity
  name: egun
  parent: BaseWeaponBattery
  id: WeaponEgun
  description: Egun
  components:
    - type: Sprite
      sprite: _Maid/Objects/Weapons/Guns/Battery/egun.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-twomode1-4
          map: ["enum.TwoModeEnergyGunVisualLayers.Mag"]
          shader: unshaded
    - type: Clothing
      sprite: _Maid/Objects/Weapons/Guns/Battery/egun.rsi
      quickEquip: false
      slots:
      - Belt
      - suitStorage
    - type: Gun
      soundGunshot:
        path: /Audio/_Maid/Weapons/Guns/Gunshots/laser_cannon.ogg #Maid
      soundMode:
        path: /Audio/_Maid/Weapons/Guns/Misc/egun_toggle.ogg
    # fireCost is the price of one charge, 1000 battery = 20 charges
    - type: ProjectileBatteryAmmoProvider
      proto: BulletDisabler
      fireCost: 50
    # Switched by using it in hand, the stun mode spends 1 charge per shot and the laser 2
    - type: TwoModeEnergyGun
      modes:
      - proto: BulletDisabler
        charges: 1
        name: gun-twomode-Stun
        magState: mag-twomode1
        soundGunshot:
          path: /Audio/Weapons/Guns/Gunshots/taser.ogg
      - proto: BulletTrailLaser
        charges: 2
        name: gun-twomode-Laser
        magState: mag-twomode2
        heldPrefix: laser
        soundGunshot:
          path: /Audio/_Maid/Weapons/Guns/Gunshots/laser_cannon.ogg
    - type: Appearance
    - type: StaticPrice
      price: 800
    - type: Item
      size: Large
      shape:
      - 0, 0, 3, 1

- type: entity
  parent: [GunSafeBaseSecure, BaseSecurityContraband]
  id: GunSafeEgun
  name: egun safe
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillGunSafeEgun

- type: entityTable
  id: FillGunSafeEgun
  table: !type:AllSelector
    children:
    - id: WeaponEgun
      amount: 3
