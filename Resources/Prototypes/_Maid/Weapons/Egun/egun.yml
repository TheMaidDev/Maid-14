- type: entity
  name: egun
  parent: BaseWeaponBattery
  id: WeaponEgun
  description: Egun
  components:
    - type: Sprite
      sprite: _Maid/Objects/Weapons/Guns/Battery/egun.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-twomode1-4
          shader: unshaded
    - type: Clothing
      sprite: _Maid/Objects/Weapons/Guns/Battery/egun.rsi
      quickEquip: false
      slots:
      - Belt
      - suitStorage
    - type: Gun
      soundGunshot:
        path: /Audio/_Maid/Weapons/Guns/Gunshots/laser_cannon.ogg #Maid
      soundMode:
        path: /Audio/_Maid/Weapons/Guns/Misc/egun_toggle.ogg
    - type: ProjectileBatteryAmmoProvider
      proto: BulletDisabler
      fireCost: 49
    - type: BatteryWeaponFireModes
      fireModes:
      - proto: BulletDisabler
        fireCost: 49
      - proto: BulletTrailLaser
        fireCost: 99
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: true
    - type: Appearance
    - type: StaticPrice
      price: 800
    - type: Item
      size: Large
      shape:
      - 0, 0, 3, 1

- type: entity
  parent: [GunSafeBaseSecure, BaseSecurityContraband]
  id: GunSafeEgun
  name: egun safe
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillGunSafeEgun

- type: entityTable
  id: FillGunSafeEgun
  table: !type:AllSelector
    children:
    - id: WeaponEgun
      amount: 3
