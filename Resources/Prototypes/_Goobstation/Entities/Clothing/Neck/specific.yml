- type: entity
  parent: ClothingNeckBase
  id: SurveillanceWirelessCameraBodySecurity
  name: security bodycam
  description: A body mounted camera. It's watching you.
  components:
  - type: DeviceNetwork
    deviceNetId: Wired # :clueless:
    receiveFrequencyId: SurveillanceCameraSecurity
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    networkSet: true
    nameSet: True
    mobile: True  # Goobstation - mobile cameras fix
    id: Bodycam
  - type: Eye
  - type: WirelessNetworkConnection
    range: 200
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: ClothingGrantComponent
    component:
    - type: StationAiVision
      range: 4
# MAID BEGIN feat-sprite-porting-3
  - type: SurveillanceBodyCamera
  - type: ItemToggle
  - type: ToggleClothing
    action: ToggleBodyCamera
  - type: ToggleCellDraw
  - type: PowerCellDraw
    drawRate: 0.3
    enabled: false
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: ToggleClothingPrefix
    prefixOn: null
    prefixOff: off
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: active-animated }
          False: { state: unpowered }
  - type: Sprite
    sprite: _Maid/Objects/Specific/Security/body-camera.rsi
    layers:
      - state: unpowered
      - state: active-animated
        map: ["active"]
        visible: false
  - type: Clothing
    sprite: _Maid/Objects/Specific/Security/body-camera.rsi
    equippedPrefix: off
    quickEquip: true
  - type: Item
    heldPrefix: off
# MAID END feat-sprite-porting-3

- type: entity
