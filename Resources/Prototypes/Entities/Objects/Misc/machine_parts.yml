- type: entity
  id: BaseStockPart
  name: stock part
  parent: BaseItem
  description: What?
  abstract: true
  components:
    # Goobstation edit start
    - type: EmitSoundOnPickup
      sound:
        path: /Audio/_Maid/Items/handling/component_pickup.ogg # MAID sound-porting
    - type: EmitSoundOnDrop
      sound:
        path: /Audio/_Maid/Items/handling/component_drop.ogg # MAID sound-porting
    - type: EmitSoundOnLand
      sound:
        path: /Audio/_Maid/Items/handling/component_drop.ogg # MAID sound-porting
    # Goobstation edit end
    - type: Sprite
      sprite: _Maid/Objects/Misc/stock_parts.rsi #Maid
    - type: Item
      size: Tiny
    - type: Stack
      count: 1
    - type: PhysicalComposition #Goobstation - Recycle update
      materialComposition:
        Steel: 12
        Plastic: 12
    - type: StockPart # Goobstation
    - type: StrictStackPrototype # MAID revert machine parts - rated parts must not turn into basic ones when split/merged

# MAID BEGIN
- type: entity
  id: CapacitorStockPart
  name: capacitor
  parent: BaseStockPart
  description: A basic capacitor used in the construction of a variety of devices.
  suffix: Rating 1
  components:
    - type: Sprite
      state: capacitor
    - type: Tag
      tags:
        - CapacitorStockPart
    - type: Stack
      stackType: Capacitor
# MAID END


