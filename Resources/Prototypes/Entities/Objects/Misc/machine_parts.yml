- type: entity
  id: BaseSubspaceStockPart
  name: subspace stock part
  parent: BaseItem
  description: What?
  abstract: true
  components:
    - type: EmitSoundOnPickup
      sound:
        path: /Audio/_Maid/Items/handling/component_pickup.ogg
    - type: EmitSoundOnDrop
