- type: entity
  name: telecrystal
  parent: [BaseItem, BaseSyndicateContraband]
  id: Telecrystal
  # MAID uplink price rebalance
  suffix: 20 TC # MAID uplink price rebalance
  description: It seems to be pulsing with suspiciously enticing energies.
  components:
  - type: Sprite
    sprite: Objects/Specific/Syndicate/telecrystal.rsi
    state: telecrystal
  - type: Item
    sprite: Objects/Specific/Syndicate/telecrystal.rsi
    size: Tiny
  - type: Stack
    count: 20 # MAID uplink price rebalance
    stackType: Telecrystal
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 200 # MAID uplink price rebalance
  - type: Currency
    price:
      Telecrystal: 1
  # Goobstation
  - type: Tag
    tags:
    - Telecrystal

